set-option -g mouse on
set-option -g focus-events on

set -g history-limit 10000

#remap prefix from 'C-b' to 'C-a'
set -g prefix C-a
unbind C-b
bind a send-prefix

# split pane
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind q killp

# navigation pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resizing pane
bind -r H resize-pane -L "5"
bind -r J resize-pane -D "5"
bind -r K resize-pane -U "5"
bind -r L resize-pane -R "5"

#swapping pane
bind -r "<" swap-window -t -1
bind -r ">" swap-window -t +1

#toggle theme
bind -n F6 run-shell "~/.local/bin/switch_theme.sh"

#======================DISPLAY===============================
set -g default-terminal "${TERM}"
set -ga terminal-overrides ',*256col*:Tc'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# Copy mode colors
set-window-option -g mode-style 'fg=black,bg=orange'

#status bar
set -g base-index 1
# setw -g allow-rename off
set-option -g set-titles on
set-option -g status-interval 2
set-option -g automatic-rename on

# Move status bar to top of the screen
set -g status-position top

#Add bottom padding of status bar
set -g status 2 #Set 2 status bares
set -g 'status-format[1]' ''

# Force gapless window numbering sequence
set-option -g renumber-windows on

set -g status-left-length 200
set -g status-right-length 200

# %hidden c_bg=terminal
# %hidden c_fg=terminal

set -g status-style "bg=terminal"

set -g status-left "  #[fg=red] #S #[fg=green]#{?client_prefix,󰠖 ,  } "
# set -g status-left "  #{?client_prefix,💥, }#S"
# set -ga status-left "#[bg=$c_bg]#[fg=$c_fg] #{?window_zoomed_flag,👀 ,   }"

set -g status-right "#[fg=cyan]   %H:%M #[fg=black]│"
set -ga status-right "#[fg=magenta] %a %d-%m  "

set -g window-status-format " #[fg=brightblack][#I] #W "
set -g window-status-current-format " #[fg=yellow,bold][#I] #W#[fg=blue]#{?window_zoomed_flag,󰊓, }"
set-option -g automatic-rename-format "#{b:pane_current_path}#{pane_current_command}"
set -g window-status-separator " #[fg=black]⏽ "

# panes
setw -g pane-base-index 0
set -g pane-active-border-style "fg=yellow"
set -g pane-border-style "fg=brightwhite"

set -g window-style fg=brightwhite,bg=black
set -g window-active-style fg=terminal,bg=terminal

# copy paste in tmux scroll
set-window-option -g mode-keys vi
bind P paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi r send-keys -X rectangle-toggle
# bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -in -selection clipboard"  # this line for ubuntu, install "xclip to use"
# set -s set-clipboard off # on ubuntu to prevent puts a tons of string when yank with "y" button

bind -T copy-mode-vi y send-keys -X copy-selection # this line for iterm2 macOSX


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'thewtex/tmux-mem-cpu-load'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-nvim 'session'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

#run-shell ~/clone/path/resurrect.tmux
#run-shell ~/clone-tmux-continuum/path/continuum.tmux
#run-shell ~/clone/path/yank.tmux

# http://unix.stackexchange.com/a/25638
set -sg escape-time 10
